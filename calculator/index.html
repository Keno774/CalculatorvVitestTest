<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calculator</title>
  </head>
  <body>
    <main id="app" class="calculator">
      <h1>Calculator</h1>
      <div class="fields">
        <label for="first-number">First number</label>
        <input id="first-number" type="text" inputmode="decimal" placeholder="e.g. 12.5" />

        <label for="second-number">Second number</label>
        <input id="second-number" type="text" inputmode="decimal" placeholder="e.g. -3" />
      </div>

      <div class="buttons" aria-label="Calculator operations">
        <button type="button" data-operation="add">Add</button>
        <button type="button" data-operation="subtract">Subtract</button>
        <button type="button" data-operation="multiply">Multiply</button>
        <button type="button" data-operation="divide">Divide</button>
      </div>

      <button class="reset-button" type="button" data-operation="reset">Reset</button>
      <p id="error" class="error" role="alert"></p>
      <p class="result-label">Result</p>
      <output id="result" aria-live="polite"></output>
    </main>
    <script type="module" src="/src/calculator.js"></script>
  </body>
</html>
